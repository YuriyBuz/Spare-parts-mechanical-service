<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 13px;
         color: #0f172a; margin: 0; padding: 14px; background: #f8fafc; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  p.hint { color: #64748b; font-size: 12px; margin: 0 0 14px; line-height: 1.45; }
  button { width: 100%; padding: 10px 12px; margin-bottom: 8px; border-radius: 8px;
           border: 1px solid #cbd5e1; background: #fff; font-size: 13px; cursor: pointer;
           text-align: left; }
  button:hover:enabled { background: #f1f5f9; }
  button:disabled { opacity: .55; cursor: default; }
  button.primary { background: #10b981; border-color: #059669; color: #fff; font-weight: 600; }
  button.primary:hover:enabled { background: #059669; }
  input { width: 100%; box-sizing: border-box; padding: 8px 10px; margin-bottom: 8px;
          border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; }
  .sep { height: 1px; background: #e2e8f0; margin: 14px 0; }
  #out { white-space: pre-wrap; background: #fff; border: 1px solid #e2e8f0; border-radius: 8px;
         padding: 10px; font-size: 12px; line-height: 1.5; min-height: 40px; color: #334155; }
  .busy { color: #b45309; }
  .err { color: #b91c1c; }
</style>
</head>
<body>
  <h1>Табель — керування</h1>
  <p class="hint">Новий аркуш копіює працівників з попереднього місяця, очищає години,
    звіряє ПІБ з довідником <b>gw-ref</b>, проставляє <b>emp_id</b> і надсилає звіт адміністратору.</p>

  <button class="primary" id="btnNext" onclick="run('uiCreateNextMonth')">
    ➕ Створити аркуш «<span id="nextName">наступного місяця</span>»
  </button>

  <div class="sep"></div>

  <input id="month" placeholder="Інший місяць: 2026-10 або «Жовтень 2026»">
  <button id="btnChosen" onclick="runWith('uiCreateChosenMonth')">📅 Створити вказаний місяць</button>

  <div class="sep"></div>

  <button id="btnSync" onclick="run('uiSyncActiveSheet')">🔍 Звірити ПІБ на відкритому аркуші</button>
  <button id="btnFill" onclick="run('uiBackfillEmpIds')">🆔 Проставити emp_id у всіх місяцях</button>

  <div class="sep"></div>
  <div id="out">Готово до роботи.</div>

<script>
  var out = document.getElementById('out');
  var buttons = ['btnNext', 'btnChosen', 'btnSync', 'btnFill'];

  function lock(state) {
    buttons.forEach(function (id) { document.getElementById(id).disabled = state; });
  }
  function done(text) {
    lock(false);
    out.className = '';
    out.textContent = text;
  }
  function fail(err) {
    lock(false);
    out.className = 'err';
    out.textContent = '❌ ' + (err && err.message ? err.message : err);
  }
  function busy() {
    lock(true);
    out.className = 'busy';
    out.textContent = 'Виконую… Це може зайняти до хвилини.';
  }
  function run(fn) {
    busy();
    google.script.run.withSuccessHandler(done).withFailureHandler(fail)[fn]();
  }
  function runWith(fn) {
    var value = document.getElementById('month').value.trim();
    if (!value) { out.className = 'err'; out.textContent = 'Вкажіть місяць.'; return; }
    busy();
    google.script.run.withSuccessHandler(done).withFailureHandler(fail)[fn](value);
  }

  google.script.run.withSuccessHandler(function (name) {
    document.getElementById('nextName').textContent = name;
  }).uiNextMonthName();
</script>
</body>
</html>
