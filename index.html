            document.getElementById('modalPartEquipment').textContent = item.equipment;
            document.getElementById('modalCurrentStock').textContent = item.hasStock === false ? 'не інвентаризовано' : `${item.currentStock} шт`;
            document.getElementById('modalStorage').textContent = item.storage || 'не вказано';
            document.getElementById('editStorageBtn').classList.toggle('hidden', !can('manageStorage'));
            
            document.getElementById('useQuantity').value = 1;
            document.getElementById('useLocation').value = item.equipment; // Дефолт
            document.getElementById('useSerial').value = '';
            document.getElementById('useDate').value = new Date().toISOString().split('T')[0];

            // Типова операція — перша, дозволена роллю
            setOperation(['registerUsage', 'registerInventory', 'registerRestock'].filter(can)[0] || 'registerUsage');
            document.getElementById('usedByName').textContent = mechanic;

            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            setTimeout(() => { modalContent.classList.remove('translate-y-full'); }, 10);
        };

        const closeUsageModal = () => {
            modalContent.classList.add('translate-y-full');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                currentSelectedItem = null;
            }, 300);
        };

        // --- Адресне зберігання ---
        document.getElementById('editStorageBtn').addEventListener('click', async () => {
            if (!currentSelectedItem || !can('manageStorage')) return;

            const value = await showPromptDialog(
                `Місце зберігання для «${currentSelectedItem.model}»:<br><span class="text-sm text-gray-500">Наприклад: Контейнер 1, стелаж B, полиця 3</span>`,
                currentSelectedItem.storage || 'Стелаж / полиця / комірка');
            if (value === null) return;

            try {
                const result = await apiPost({
                    action: 'setStorage',
                    sheetName: currentSelectedItem.sheetName,
                    row: currentSelectedItem.row,
                    model: currentSelectedItem.model,
                    storage: value,
                    token: session.token, deviceId: getDeviceId()
                });
                if (result && result.success) {
                    currentSelectedItem.storage = result.storage;
                    document.getElementById('modalStorage').textContent = result.storage || 'не вказано';
                    const category = allData.find(c => c.name === currentSelectedItem.sheetName);
                    const item = category && category.items.find(i => i.row === currentSelectedItem.row);
                    if (item) item.storage = result.storage;
                    localStorage.setItem(CACHE_KEY, JSON.stringify(allData));
                    renderState();
                } else if (result && result.code === 'AUTH') {
                    handleAuthFailure();
                } else {
                    customAlert('❌ ' + ((result && result.error) || 'Не вдалося зберегти місце'));
                }
            } catch (e) {
                customAlert('❌ Немає зв’язку — місце зберігання змінюється лише онлайн.');
            }
        });

        document.getElementById('closeUsageModalBtn').addEventListener('click', closeUsageModal);
        modal.addEventListener('click', (e) => { if (e.target === modal) closeUsageModal(); });

        // --- Відправка даних ---
        /**
         * Розбирає постійну відмову сервера разом із користувачем.
         * Повертає true, якщо запис зрештою пройшов.
         */
        const resolveFailedItem = async (opId) => {
            const item = outboxItem(opId);
            if (!item) return false;

            if (item.code === 'OVERDRAW') {
                const available = Number(item.response && item.response.available) || 0;
                const choice = await showChoiceDialog(item.lastError + '<br><br>Що робимо?',
                    (available > 0 ? [{ key: 'limit', label: 'Списати наявні ' + available + ' шт', primary: true }] : [])
                    .concat([{ key: 'reason', label: 'Списати понад залишок і пояснити' },
                             { key: 'keep', label: 'Лишити в черзі' }]));

                if (choice === 'limit') {
                    patchItem(opId, { status: 'pending', attempts: 0, nextAttemptAt: 0,
                        payload: Object.assign({}, item.payload, { quantity: available }) });
                } else if (choice === 'reason') {
                    const reason = await showPromptDialog(
                        'Чому списується більше, ніж є на складі?', 'Наприклад: залишок у таблиці застарілий');
                    if (!reason || reason.length < 3) {
                        customAlert('Потрібне пояснення — без нього перевитрата не записується.');
                        return false;
                    }
                    patchItem(opId, { status: 'pending', attempts: 0, nextAttemptAt: 0,
                        payload: Object.assign({}, item.payload, { overdrawReason: reason }) });
                } else {
                    return false;
                }
                return (await sendItem(opId)) === 'done';
            }

            if (item.code === 'NOT_COUNTED') {
                if (!can('registerInventory')) {
                    customAlert(item.lastError + '\n\nІнвентаризацію проводить zip.admin або admin.');
                    return false;
                }
                const go = await showCustomDialog(item.lastError + '\n\nПровести інвентаризацію зараз?', true);
                if (go) {
                    removeItem(opId);
                    setOperation('registerInventory');
                    document.getElementById('useQuantity').value = 0;
                    document.getElementById('useQuantity').focus();
                }
                return false;
            }

            customAlert('❌ ' + item.lastError);
            return false;
        };

        document.getElementById('submitUsageBtn').addEventListener('click', async () => {
            if (!currentSelectedItem) return;

            const quantity = parseFloat(document.getElementById('useQuantity').value);
            const location = document.getElementById('useLocation').value.trim();
            const serial = document.getElementById('useSerial').value.trim();
            const date = document.getElementById('useDate').value; // Формат "YYYY-MM-DD"
            const isUsage = currentOperation === 'registerUsage';

            if (!session) { showLogin(); return; }
            if (!can(currentOperation)) { customAlert('Ваша роль не дозволяє цю операцію.'); return; }

            if (!isFinite(quantity) || quantity < 0 || (quantity === 0 && currentOperation !== 'registerInventory')) {
                customAlert("Введіть коректну кількість!"); return;
            }
            if (isUsage && !location) { customAlert("Вкажіть, де була використана деталь!"); return; }

            // Без зв'язку сервер не підкаже про перевитрату — попереджаємо за кешованим залишком
            if (isUsage && !navigator.onLine && currentSelectedItem.hasStock !== false) {
                const cached = parseFloat(currentSelectedItem.currentStock);
                if (isFinite(cached) && quantity > cached) {
                    const go = await showCustomDialog(
                        `Зв’язку немає, а за останніми даними на складі ${cached} шт — ви списуєте ${quantity}.\n\nЗапис збережеться, але сервер може його відхилити. Продовжити?`, true);
                    if (!go) return;
                }
            }

            // «Хто видав» і «ким використано» сервер бере із сесії, тому не надсилаємо
            const payload = {
                action: currentOperation,
                sheetName: currentSelectedItem.sheetName,
                row: currentSelectedItem.row,
                model: currentSelectedItem.model,
                quantity: quantity,
                location: location || '-',
                serial: serial,
                date: date,
                // Час створення — він же ідентифікатор операції: повторна
                // відправка з черги не спише вдруге
                timestamp: new Date().toISOString()
            };

            // Міняємо лише підпис: підміна innerHTML знищила б <span id="submitBtnText">,
            // на який спирається setOperation()
            const btn = document.getElementById('submitUsageBtn');
            const btnLabel = document.getElementById('submitBtnText');
            btnLabel.textContent = 'Зачекайте…';
            btn.disabled = true;

            try {
                // Спершу в чергу — навіть онлайн. Якщо вкладку вб'ють у момент
                // запиту, запис не зникне і піде при наступному запуску.
                const item = enqueueOperation(payload);
                const outcome = await sendItem(item.opId);

                if (outcome === 'done') {
                    showSuccessAndClose(false, outboxItem(item.opId).response);
                } else if (outcome === 'auth') {
                    closeUsageModal();
                    handleAuthFailure();
                } else if (outcome === 'failed') {
                    if (await resolveFailedItem(item.opId)) {
                        showSuccessAndClose(false, outboxItem(item.opId).response);
                    }
                } else {
                    closeUsageModal();
                    customAlert('Немає зв’язку.\nЗапис збережено на пристрої й надійде автоматично, щойно з’явиться мережа.');
                }
            } finally {
                // Операція могла змінитися під час запиту — підпис ставимо за поточною
                btnLabel.textContent = OPERATION_UI[currentOperation].btn;
                btn.disabled = false;
            }
        });

        const showSuccessAndClose = (isOffline = false, result = null) => {
            if (currentSelectedItem) {
                const qty = parseFloat(document.getElementById('useQuantity').value);
                const categoryData = allData.find(c => c.name === currentSelectedItem.sheetName);
                if (categoryData) {
                    const itemInArray = categoryData.items.find(i => i.row === currentSelectedItem.row);
                    if (itemInArray) {
                        // Авторитетне значення — перерахований сервером залишок;
                        // локальна арифметика лишається тільки для офлайну
                        const before = parseFloat(itemInArray.currentStock) || 0;
                        const local = currentOperation === 'registerUsage' ? before - qty
                                    : currentOperation === 'registerRestock' ? before + qty
                                    : qty;
                        itemInArray.currentStock = String(
                            (result && typeof result.newStock === 'number') ? result.newStock : local);
                        itemInArray.hasStock = true;
                    }
                }
                localStorage.setItem(CACHE_KEY, JSON.stringify(allData));
                renderState();
            }

            closeUsageModal();
            
            if (isOffline) {
                customAlert("Відсутній зв'язок.\nЗапис збережено в телефоні і буде відправлено автоматично при появі інтернету!");
            } else {
                const toast = document.createElement('div');
                toast.className = 'fixed top-4 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-lg z-[3000] font-bold text-sm flex items-center transition-opacity duration-300';
                toast.innerHTML = '<svg class="w-5 h-5 text-emerald-400 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> ' + OPERATION_UI[currentOperation].toast;
                document.body.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    setTimeout(() => toast.remove(), 300);
                }, 2000);
            }

            const gap = result && result.discrepancy;
            if (gap && gap.delta !== null && gap.delta !== 0) {
                setTimeout(() => customAlert(
                    `Зафіксовано розбіжність:\nобліковий залишок ${gap.accounted}, фактичний ${gap.fact} (${gap.delta > 0 ? '+' : ''}${gap.delta}).\n\nЗапис додано в журнал, попередні операції збережено.`), 400);
            } else if (result && result.warning) {
                setTimeout(() => customAlert('⚠️ ' + result.warning), 400);
            }
        };

        // --- Ярлики з маніфесту (?view=...) ---
        const applyManifestShortcut = () => {
            const view = new URLSearchParams(window.location.search).get('view');
            if (!view) return;

            // Прибираємо параметр з адреси, щоб він не спрацював повторно
            history.replaceState(null, '', window.location.pathname);

            if (view === 'history-today') {
                fetchHistory(true);
            } else if (view === 'history') {
                fetchHistory(false);
            } else if (view === 'search') {
                document.getElementById('searchInput').focus();
            }
        };

        // --- Service worker (встановлення на телефон + робота офлайн) ---
        const registerServiceWorker = () => {
            // Працює лише у безпечному контексті (https або localhost)
            if (!navigator.serviceWorker || !window.isSecureContext) return;
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch((err) => {
                    console.warn('Service worker не зареєстровано:', err);
                });
            });
        };

        // --- Ініціалізація ---
        document.addEventListener('DOMContentLoaded', () => {
            updateNetworkStatus();
            registerServiceWorker();
            
            try { peopleLists = JSON.parse(localStorage.getItem(PEOPLE_KEY)) || peopleLists; } catch (e) { /* кеш зіпсовано — беремо запасний список */ }

            // Сесія переживає перезавантаження: токен лежить у localStorage,
            // тому PIN питаємо лише коли сесії немає або вона протермінована
            session = loadSession();
            applyPermissions();

            document.getElementById('loginBtn').addEventListener('click', doLogin);
            document.getElementById('pinInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') doLogin();
            });
            document.getElementById('logoutBtn').addEventListener('click', () => {
                clearSession();
                applyPermissions();
                showLogin('Ви вийшли із застосунку');
            });

            migrateLegacyQueue();
            resetBackoff();   // сторінку щойно відкрили — це нова спроба, а не продовження старої
            window.addEventListener('online', () => { updateNetworkStatus(); resetBackoff(); flushOutbox(); });
            window.addEventListener('offline', updateNetworkStatus);
            document.addEventListener('visibilitychange', () => { if (!document.hidden) flushOutbox(); });
            setInterval(() => { if (outboxCounts().pending) flushOutbox(); }, SYNC_INTERVAL_MS);

            document.getElementById('networkStatusBtn').addEventListener('click', openQueuePanel);
            document.getElementById('closeQueueBtn').addEventListener('click', closeQueuePanel);
            document.getElementById('queueOverlay').addEventListener('click', (e) => {
                if (e.target === document.getElementById('queueOverlay')) closeQueuePanel();
            });
            document.getElementById('queueFlushBtn').addEventListener('click', async () => {
                resetBackoff();
                await flushOutbox();
                renderQueue();
            });

            if (session && isIdleExpired()) {
                clearSession();
                applyPermissions();
                showLogin('Сесію завершено через 10 хвилин бездіяльності. Увійдіть за PIN.');
            } else if (session) {
                startIdleWatch();
                flushOutbox();
                // Ярлик з маніфесту застосовуємо після завантаження бази
                fetchData().then(applyManifestShortcut);
            } else {
                showLogin();
            }
        });
    </script>
</body>
</html>
