<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Облік ЗІП: Механік</title>
    
    <meta name="description" content="Журнал використання запчастин: списання ЗІП, залишки, історія рухів та план закупки. Працює офлайн.">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10b981">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="ЗІП Механік">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg-color: #ffffff;
            --text-color: #1e293b;
            --text-muted-color: #64748b;
            --item-bg-color: #f1f5f9;
            --item-hover-bg-color: #e2e8f0;
            --border-color: #e2e8f0;
            --active-btn-bg: #10b981;
            --active-btn-text: #ffffff;
            --error-btn-bg: #ef4444;
            --warning-bg: #fef3c7;
            --warning-border: #f59e0b;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            -webkit-tap-highlight-color: transparent;
            padding-bottom: 2rem;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        .card { background-color: var(--card-bg-color); }
        .text-muted { color: var(--text-muted-color); }

        .inventory-item, .category-card {
            background-color: var(--item-bg-color);
            border: 1px solid var(--border-color);
            transition: transform 0.1s ease, box-shadow 0.2s ease, background-color 0.2s;
        }
        
        .inventory-item:active, .category-card:active {
            transform: scale(0.98);
        }

        .category-card:hover {
            background-color: var(--item-hover-bg-color);
        }

        .low-stock {
            border-left: 4px solid var(--error-btn-bg);
            background-color: var(--warning-bg);
        }

        .modal-overlay { background-color: rgba(0, 0, 0, 0.6); z-index: 1000; backdrop-filter: blur(2px); }
        .modal-content { z-index: 1001; }
        
        input[type="number"], input[type="text"], input[type="date"], select {
            background-color: var(--card-bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        .network-status {
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(255,255,255,0.8);
            padding: 4px 10px;
            border-radius: 12px;
            backdrop-filter: blur(2px);
            margin-top: 0.5rem;
            margin-left: auto;
            width: fit-content;
        }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; }
        .status-dot.online { background: #10b981; }
        .status-dot.offline { background: #ef4444; }
        .status-dot.syncing { background: #f59e0b; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .loader {
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--active-btn-bg);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="font-sans">

    <div class="container mx-auto max-w-3xl p-4 sm:p-6 relative">
        <header class="relative text-center mb-6">
            <div class="absolute top-0 left-0 text-center">
                <button onclick="fetchData()" class="inline-block p-2 rounded-full text-muted transition-colors focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white shadow-sm border border-gray-200" title="Оновити дані">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                </button>
            </div>

            <div class="absolute top-0 right-0 flex flex-col items-end">
                <div class="network-status shadow-sm border border-gray-200 cursor-pointer" id="networkStatusBtn" title="Натисніть для синхронізації">
                    <span class="status-dot online" id="statusDot"></span>
                    <span id="statusText">Онлайн</span>
                </div>
            </div>
            
            <img src="https://foodline-production.com/wp-content/uploads/2021/10/3752781497_3752781497.webp" alt="Foodline Logo" class="w-16 h-auto mx-auto mb-2 rounded-lg" onerror="this.style.display='none'">
            <h1 class="text-xl sm:text-2xl font-bold text-gray-800">Журнал використання ЗІП</h1>
        </header>

        <!-- Хто працює в застосунку -->
        <div class="mb-4 card p-4 rounded-xl shadow-sm border border-gray-200 flex items-center justify-between gap-3">
            <div class="min-w-0">
                <div class="text-xs text-muted font-medium">Ви увійшли як</div>
                <div class="font-bold text-lg text-gray-800 truncate" id="sessionName">—</div>
                <div class="text-xs text-emerald-700 font-semibold" id="sessionRole"></div>
            </div>
            <button id="logoutBtn" class="flex-shrink-0 text-sm font-bold text-gray-500 hover:text-red-600 border border-gray-200 rounded-lg px-3 py-2 transition-colors">Вийти</button>
        </div>

        <!-- Кнопки дій -->
        <div class="mb-4 flex flex-wrap gap-2">
            <button onclick="fetchHistory(true)" class="flex-1 bg-blue-100 hover:bg-blue-200 text-blue-800 px-3 py-2 rounded-xl text-sm font-bold shadow-sm transition-colors flex items-center justify-center border border-blue-200" title="Історія моїх списань за сьогодні">
                <svg class="h-5 w-5 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                Мої за сьогодні
            </button>
            <button onclick="fetchHistory(false)" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-800 px-3 py-2 rounded-xl text-sm font-bold shadow-sm transition-colors flex items-center justify-center border border-gray-200" title="Загальна історія">
                <svg class="h-5 w-5 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" /></svg>
                Всі списання
            </button>
            <button id="reportBtn" onclick="forceSendReport()" class="hidden w-full sm:w-auto bg-amber-100 hover:bg-amber-200 text-amber-800 px-3 py-2 rounded-xl text-sm font-bold shadow-sm transition-colors flex items-center justify-center border border-amber-200" title="Сформувати звіт і надіслати на email">
                <svg class="h-5 w-5 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
                Надіслати звіт
            </button>
        </div>

        <!-- Пошук -->
        <div class="mb-6">
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                </div>
                <input type="text" id="searchInput" placeholder="Пошук (модель, обладнання, номер)..." class="block w-full pl-10 pr-10 py-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 card text-lg shadow-sm">
                <button id="clearSearchBtn" class="absolute inset-y-0 right-0 pr-3 flex items-center hidden text-gray-400 hover:text-gray-600">
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
        </div>

        <!-- Статус завантаження -->
        <div id="loadingState" class="flex flex-col items-center justify-center py-10 hidden">
            <div class="loader mb-4"></div>
            <p class="text-muted font-medium" id="loadingText">Завантаження бази ЗІП...</p>
        </div>

        <!-- В'ю: Список категорій -->
        <div id="categoriesView" class="pb-20">
            <h2 class="text-lg font-bold mb-3 text-emerald-700 px-1">Категорії:</h2>
            <div id="categoriesContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <!-- Категорії генеруються JS -->
            </div>
        </div>

        <!-- В'ю: Список деталей всередині категорії або результати пошуку -->
        <div id="itemsView" class="hidden pb-20">
            <div class="flex items-center mb-4" id="backBtnContainer">
                <button id="backToCategoriesBtn" class="flex items-center text-emerald-600 hover:text-emerald-700 font-bold px-2 py-1 -ml-2 rounded-lg transition-colors">
                    <svg class="h-5 w-5 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                    Назад до категорій
                </button>
            </div>
            <h2 id="currentCategoryTitle" class="text-xl font-bold mb-4 text-gray-800"></h2>
            
            <div id="inventoryContainer" class="flex flex-col gap-3">
                <!-- Картки деталей генеруються JS -->
            </div>
        </div>

        <!-- В'ю: Історія -->
        <div id="historyView" class="hidden pb-20">
            <div class="flex items-center justify-between mb-4">
                <button onclick="appState.view = 'categories'; renderState();" class="flex items-center text-blue-600 hover:text-blue-700 font-bold px-2 py-1 -ml-2 rounded-lg transition-colors">
                    <svg class="h-5 w-5 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                    Назад
                </button>
                <h2 id="historyTitle" class="text-xl font-bold text-gray-800">Історія рухів</h2>
            </div>
            
            <div id="historyContainer" class="flex flex-col gap-3">
                <!-- Історія генерується JS -->
            </div>
        </div>
    </div>

    <!-- Модальне вікно внесення використання -->
    <div id="usageModal" class="fixed inset-0 hidden items-end sm:items-center justify-center modal-overlay p-0 sm:p-4 transition-opacity">
        <div class="card w-full max-w-md rounded-t-2xl sm:rounded-2xl shadow-2xl modal-content transform transition-transform translate-y-full sm:translate-y-0" id="usageModalContent">
            <div class="p-6">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <div class="flex items-center gap-2 mb-1">
                            <span class="bg-gray-200 text-gray-800 text-xs font-bold px-2 py-1 rounded" id="modalPartNo"></span>
                            <span class="text-xs text-emerald-700 font-bold bg-emerald-100 px-2 py-1 rounded line-clamp-1" id="modalPartCategory"></span>
                        </div>
                        <h3 class="text-xl font-bold text-gray-900" id="modalPartName">6200-2RSH</h3>
                        <p class="text-sm text-muted mt-1" id="modalPartEquipment">Twist off-натяжні ролики ременів</p>
                    </div>
                    <button id="closeUsageModalBtn" class="text-gray-400 hover:text-gray-600 ml-2">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>

                <div class="bg-gray-100 p-3 rounded-lg flex justify-between items-center mb-3 border border-gray-200">
                    <span class="font-medium text-sm text-gray-700">Поточний залишок:</span>
                    <span class="font-bold text-lg text-gray-900" id="modalCurrentStock">18 шт</span>
                </div>

                <div class="flex justify-between items-center mb-6 px-1">
                    <span class="text-sm text-gray-700">📍 Місце: <span class="font-bold text-gray-900" id="modalStorage">не вказано</span></span>
                    <button id="editStorageBtn" class="hidden text-xs font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-lg px-3 py-1 hover:bg-emerald-100 transition-colors">Змінити</button>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold mb-1 text-gray-700">Операція:</label>
                        <div class="grid grid-cols-3 gap-2" id="operationSwitch">
                            <button type="button" data-op="registerUsage" class="op-btn py-2 px-2 rounded-lg text-sm font-bold border transition-colors">Видача</button>
                            <button type="button" data-op="registerRestock" class="op-btn py-2 px-2 rounded-lg text-sm font-bold border transition-colors">Поповнення</button>
                            <button type="button" data-op="registerInventory" class="op-btn py-2 px-2 rounded-lg text-sm font-bold border transition-colors">Інвентар.</button>
                        </div>
                    </div>

                    <div>
                        <label id="qtyLabel" class="block text-sm font-bold mb-1 text-gray-700">Кількість використано (шт):</label>
                        <input type="number" id="useQuantity" min="1" value="1" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-emerald-500 font-bold text-lg text-center" inputmode="numeric">
                    </div>

                    <div id="usedByWrap" class="bg-gray-50 border border-gray-200 rounded-lg p-3">
                        <div class="text-xs text-muted font-medium">Ким було використано</div>
                        <div class="font-bold text-gray-800" id="usedByName">—</div>
                    </div>

                    <div>
                        <label id="locationLabel" class="block text-sm font-bold mb-1 text-gray-700">Де було використано:</label>
                        <input type="text" id="useLocation" placeholder="Наприклад: Лінія 1, мотор конвеєра" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-emerald-500 text-base">
                    </div>

                    <div>
                        <label class="block text-sm font-bold mb-1 text-gray-700">Заводський № / партія (необов'язково):</label>
                        <input type="text" id="useSerial" placeholder="—" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-emerald-500 text-base">
                    </div>

                    <div>
                        <label id="dateLabel" class="block text-sm font-bold mb-1 text-gray-700">Дата використання:</label>
                        <input type="date" id="useDate" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-emerald-500 text-base">
                    </div>
                </div>

                <div class="mt-8 flex gap-3">
                    <button id="submitUsageBtn" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition-transform active:scale-95 text-lg flex justify-center items-center">
                        <svg class="w-5 h-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                        <span id="submitBtnText">Зареєструвати видачу</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Вхід за PIN -->
    <div id="loginOverlay" class="fixed inset-0 hidden items-center justify-center modal-overlay z-[2500] p-4">
        <div class="card w-full max-w-sm rounded-2xl shadow-xl p-6 border border-gray-200">
            <img src="https://foodline-production.com/wp-content/uploads/2021/10/3752781497_3752781497.webp" alt="" class="w-14 h-auto mx-auto mb-3 rounded-lg" onerror="this.style.display='none'">
            <h2 class="text-xl font-bold text-center text-gray-800 mb-1">Облік ЗІП</h2>
            <p class="text-sm text-muted text-center mb-5">Введіть свій PIN, щоб увійти</p>
            <input type="password" id="pinInput" inputmode="numeric" autocomplete="off" placeholder="••••"
                   class="w-full p-3 border rounded-lg text-center text-2xl tracking-widest font-bold focus:outline-none focus:ring-2 focus:ring-emerald-500">
            <p id="loginError" class="hidden text-sm text-red-600 font-medium mt-3 text-center"></p>
            <button id="loginBtn" class="mt-5 w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-lg transition-transform active:scale-95 text-lg flex justify-center items-center">Увійти</button>
        </div>
    </div>

    <!-- Черга операцій -->
    <div id="queueOverlay" class="fixed inset-0 hidden items-end sm:items-center justify-center modal-overlay z-[2200] p-0 sm:p-4">
        <div class="card w-full max-w-md rounded-t-2xl sm:rounded-2xl shadow-2xl flex flex-col" style="max-height: 85vh;">
            <div class="p-5 border-b border-gray-200 flex items-start justify-between">
                <div>
                    <h3 class="text-lg font-bold text-gray-900">Черга операцій</h3>
                    <p class="text-xs text-muted" id="queueSummary">—</p>
                </div>
                <button id="closeQueueBtn" class="text-gray-400 hover:text-gray-600 ml-2">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div id="queueList" class="overflow-y-auto p-4 flex flex-col gap-3"></div>
            <div class="p-4 border-t border-gray-200">
                <button id="queueFlushBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl shadow transition-transform active:scale-95">Надіслати все</button>
            </div>
        </div>
    </div>

    <!-- Кастомний Alert -->
    <div id="customDialogOverlay" class="fixed inset-0 hidden items-center justify-center modal-overlay z-[2000] p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 text-center transform transition-all border border-gray-100">
            <h3 id="customDialogMessage" class="text-lg font-bold mb-6 text-gray-800 whitespace-pre-wrap"></h3>
            <div class="flex justify-center gap-3" id="customDialogButtons"></div>
        </div>
    </div>

    <script>
        // --- НАЛАШТУВАННЯ ---
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwfDj4chPzg50KbKwfcPX3dA92I2Vz14z3_ICA2arDEYb-Vk0X3GNDZj3eCg8GximMS/exec'; 

        let allData = []; 
        let historyData = [];
        let appState = {
            view: 'categories', 
            activeCategory: null,
            filterHistoryToday: false
        };
        let currentSelectedItem = null;
        let currentOperation = 'registerUsage';
        let peopleLists = { controllers: [], employees: [] };
        // Використовується, доки аркуш «Користувачі» в таблиці не заповнено
        const FALLBACK_PEOPLE = ['Гора Андрій Олександрович', 'Галагін Євгеній Ярославович', 'Сабадаш Геннадій Петрович'];
        const OFFLINE_KEY = 'zipOfflineQueueV3';
        const SESSION_KEY = 'zipSessionV1';
        const DEVICE_KEY = 'zipDeviceIdV1';
        let session = null;
        const CACHE_KEY = 'zipInventoryCacheV3';
        const PEOPLE_KEY = 'zipPeopleV1';

        // --- Custom Dialog System ---
        const showCustomDialog = (message, isConfirm = false) => {
            return new Promise((resolve) => {
                const overlay = document.getElementById('customDialogOverlay');
                const msgEl = document.getElementById('customDialogMessage');
                const btnsEl = document.getElementById('customDialogButtons');

                msgEl.innerHTML = message; // Дозволяємо HTML замість textContent
                btnsEl.innerHTML = '';

                const closeDialog = () => {
                    overlay.classList.add('hidden');
                    overlay.classList.remove('flex');
                };

                if (isConfirm) {
                    const btnCancel = document.createElement('button');
                    btnCancel.className = 'px-4 py-2 bg-gray-200 text-gray-800 rounded-lg font-semibold hover:bg-gray-300 transition-colors';
                    btnCancel.textContent = 'Скасувати';
                    btnCancel.onclick = () => { closeDialog(); resolve(false); };

                    const btnOk = document.createElement('button');
                    btnOk.className = 'px-4 py-2 bg-emerald-500 text-white rounded-lg font-semibold hover:bg-emerald-600 transition-colors shadow-md';
                    btnOk.textContent = 'Підтвердити';
                    btnOk.onclick = () => { closeDialog(); resolve(true); };

                    btnsEl.appendChild(btnCancel);
                    btnsEl.appendChild(btnOk);
                } else {
                    const btnOk = document.createElement('button');
                    btnOk.className = 'px-6 py-2 bg-emerald-500 text-white rounded-lg font-semibold hover:bg-emerald-600 transition-colors shadow-md';
                    btnOk.textContent = 'Зрозуміло';
                    btnOk.onclick = () => { closeDialog(); resolve(true); };
                    btnsEl.appendChild(btnOk);
                }

                overlay.classList.remove('hidden');
                overlay.classList.add('flex');
            });
        };

        // Діалог із кількома варіантами: повертає ключ обраної кнопки
        const showChoiceDialog = (message, buttons) => {
            return new Promise((resolve) => {
                const overlay = document.getElementById('customDialogOverlay');
                const msgEl = document.getElementById('customDialogMessage');
                const btnsEl = document.getElementById('customDialogButtons');

                msgEl.innerHTML = message;
                btnsEl.innerHTML = '';
                btnsEl.className = 'flex flex-col gap-2';

                const close = () => {
                    overlay.classList.add('hidden');
                    overlay.classList.remove('flex');
                    btnsEl.className = 'flex justify-center gap-3';
                };

                buttons.forEach(button => {
                    const el = document.createElement('button');
                    el.className = 'px-4 py-3 rounded-lg font-semibold transition-colors ' +
                        (button.primary ? 'bg-emerald-500 text-white hover:bg-emerald-600 shadow-md'
                                        : 'bg-gray-200 text-gray-800 hover:bg-gray-300');
                    el.textContent = button.label;
                    el.onclick = () => { close(); resolve(button.key); };
                    btnsEl.appendChild(el);
                });

                overlay.classList.remove('hidden');
                overlay.classList.add('flex');
            });
        };

        // Введення тексту (причина перевитрати): повертає рядок або null
        const showPromptDialog = (message, placeholder) => {
            return new Promise((resolve) => {
                const overlay = document.getElementById('customDialogOverlay');
                const msgEl = document.getElementById('customDialogMessage');
                const btnsEl = document.getElementById('customDialogButtons');

                msgEl.innerHTML = message +
                    '<input type="text" id="promptInput" class="mt-4 w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 text-base" placeholder="' + (placeholder || '') + '">';
                btnsEl.innerHTML = '';

                const close = () => {
                    overlay.classList.add('hidden');
                    overlay.classList.remove('flex');
                };

                const cancel = document.createElement('button');
                cancel.className = 'px-4 py-2 bg-gray-200 text-gray-800 rounded-lg font-semibold hover:bg-gray-300 transition-colors';
                cancel.textContent = 'Скасувати';
                cancel.onclick = () => { close(); resolve(null); };

                const confirm = document.createElement('button');
                confirm.className = 'px-4 py-2 bg-emerald-500 text-white rounded-lg font-semibold hover:bg-emerald-600 transition-colors shadow-md';
                confirm.textContent = 'Підтвердити';
                confirm.onclick = () => {
                    const value = document.getElementById('promptInput').value.trim();
                    close();
                    resolve(value || null);
                };

                btnsEl.appendChild(cancel);
                btnsEl.appendChild(confirm);
                overlay.classList.remove('hidden');
                overlay.classList.add('flex');
                setTimeout(() => document.getElementById('promptInput').focus(), 100);
            });
        };

        const customAlert = (msg) => showCustomDialog(msg, false);

        // --- Сесія ---
        // Токен, ім'я, роль і перелік дозволених дій лежать у localStorage.
        // PIN не зберігається ніде: він іде на сервер один раз під час входу.
        const getDeviceId = () => {
            let id = localStorage.getItem(DEVICE_KEY);
            if (!id) {
                id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
                     : Date.now().toString(36) + Math.random().toString(36).slice(2);
                localStorage.setItem(DEVICE_KEY, id);
            }
            return id;
        };

        const loadSession = () => {
            try {
                const stored = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
                if (stored && stored.token && stored.expiresAt > Date.now()) return stored;
            } catch (e) { /* зіпсований запис — вважаємо, що сесії немає */ }
            localStorage.removeItem(SESSION_KEY);
            return null;
        };

        const saveSession = (value) => {
            session = value;
            localStorage.setItem(SESSION_KEY, JSON.stringify(value));
        };

        const clearSession = () => {
            session = null;
            localStorage.removeItem(SESSION_KEY);
        };

        // --- Автовихід через 10 хвилин бездіяльності ---
        const IDLE_LIMIT_MS = 10 * 60 * 1000;
        const ACTIVITY_KEY = 'zipLastActivityV1';
        let idleTimer = null;
        let lastActivityWrite = 0;

        const autoLogout = () => {
            if (!session) return;
            clearSession();
            applyPermissions();
            closeUsageModal();
            showLogin('Сесію завершено через 10 хвилин бездіяльності. Увійдіть за PIN.');
        };

        const markActivity = () => {
            if (!session) return;
            const now = Date.now();
            if (now - lastActivityWrite > 5000) {
                localStorage.setItem(ACTIVITY_KEY, String(now));
                lastActivityWrite = now;
            }
            if (idleTimer) clearTimeout(idleTimer);
            idleTimer = setTimeout(autoLogout, IDLE_LIMIT_MS);
        };

        // Сторінку могли просто закрити: перевіряємо простій і після перезавантаження
        const isIdleExpired = () => {
            const last = Number(localStorage.getItem(ACTIVITY_KEY) || 0);
            return !!last && Date.now() - last > IDLE_LIMIT_MS;
        };

        const startIdleWatch = () => {
            ['click', 'keydown', 'touchstart', 'scroll'].forEach(type =>
                document.addEventListener(type, markActivity, { passive: true }));
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden && session && isIdleExpired()) autoLogout();
            });
            markActivity();
        };

        const can = (action) => !!session && (session.permissions || []).indexOf(action) !== -1;

        // Content-Type: text/plain — «простий» запит, тому браузер не робить preflight,
        // а відповідь Apps Script можна прочитати (на відміну від mode:'no-cors')
        const REQUEST_TIMEOUT_MS = 8000;

        const apiPost = async (payload) => {
            // Замість довіри до navigator.onLine — реальна спроба з обмеженням часу
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
            try {
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload),
                    redirect: 'follow',
                    signal: controller.signal
                });
                return await response.json();
            } finally {
                clearTimeout(timer);
            }
        };

        const authQuery = () => '&token=' + encodeURIComponent(session ? session.token : '') +
                                '&device=' + encodeURIComponent(getDeviceId());

        // Читання теж має обмеження часу. Wi-Fi у цеху вміє прийняти з'єднання
        // і не відповісти нічого: без таймауту застосунок назавжди лишався б
        // на «Завантаження бази ЗІП…».
        const READ_TIMEOUT_MS = 20000;      // каталог на 250 позицій читається довше за запис
        const REPORT_TIMEOUT_MS = 60000;    // звіт ще й формується та надсилається

        const apiGet = async (action, timeoutMs) => {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs || READ_TIMEOUT_MS);
            try {
                const response = await fetch(GOOGLE_SCRIPT_URL + '?action=' + action + authQuery(),
                                             { redirect: 'follow', signal: controller.signal });
                return await response.json();
            } finally {
                clearTimeout(timer);
            }
        };

        // --- Локальне розблокування без мережі ---
        // На пристрої зберігається не PIN, а повільно обчислений перевірник.
        // Це дає змогу відкрити застосунок у підвалі; справжній бар'єр —
        // токен, який перевіряє сервер під час запису.
        const OFFLINE_UNLOCK_ENABLED = true;
        const UNLOCK_KEY = 'zipOfflineUnlockV1';
        const UNLOCK_MAX_AGE_MS = 7 * 24 * 60 * 60 * 1000;   // не довше тижня від останнього входу онлайн
        const UNLOCK_ITERATIONS = 150000;
        const OFFLINE_PERMISSIONS = ['registerUsage', 'registerRestock', 'registerInventory'];
        const OFFLINE_SESSION_MS = 12 * 60 * 60 * 1000;

        const toHex = (buffer) => Array.from(new Uint8Array(buffer))
            .map(byte => byte.toString(16).padStart(2, '0')).join('');

        const derivePinHash = async (pin, saltHex) => {
            const salt = Uint8Array.from(saltHex.match(/.{2}/g).map(pair => parseInt(pair, 16)));
            const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveBits']);
            const bits = await crypto.subtle.deriveBits(
                { name: 'PBKDF2', salt, iterations: UNLOCK_ITERATIONS, hash: 'SHA-256' }, key, 256);
            return toHex(bits);
        };

        const saveOfflineUnlock = async (pin, data) => {
            if (!OFFLINE_UNLOCK_ENABLED || !window.crypto || !crypto.subtle) return;
            try {
                const salt = toHex(crypto.getRandomValues(new Uint8Array(16)));
                localStorage.setItem(UNLOCK_KEY, JSON.stringify({
                    salt, hash: await derivePinHash(pin, salt), verifiedAt: Date.now(),
                    name: data.name, shortName: data.shortName,
                    roles: data.roles || [], permissions: data.permissions || []
                }));
            } catch (e) { /* без крипто-API просто не буде офлайн-входу */ }
        };

        const tryOfflineUnlock = async (pin) => {
            if (!OFFLINE_UNLOCK_ENABLED || !window.crypto || !crypto.subtle) return null;
            let record = null;
            try { record = JSON.parse(localStorage.getItem(UNLOCK_KEY) || 'null'); } catch (e) { return null; }
            if (!record || !record.salt) return null;
            if (Date.now() - record.verifiedAt > UNLOCK_MAX_AGE_MS) return null;
            try {
                return (await derivePinHash(pin, record.salt)) === record.hash ? record : null;
            } catch (e) { return null; }
        };

        // --- Вхід за PIN ---
        const showLogin = (message) => {
            const overlay = document.getElementById('loginOverlay');
            const error = document.getElementById('loginError');
            error.textContent = message || '';
            error.classList.toggle('hidden', !message);
            document.getElementById('pinInput').value = '';
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
            setTimeout(() => document.getElementById('pinInput').focus(), 100);
        };

        const hideLogin = () => {
            const overlay = document.getElementById('loginOverlay');
            overlay.classList.add('hidden');
            overlay.classList.remove('flex');
        };

        const applyPermissions = () => {
            document.getElementById('sessionName').textContent = session ? session.name : '—';
            document.getElementById('sessionRole').textContent = session
                ? ((session.roles || []).join(', ') + (session.offline ? ' · офлайн-режим' : ''))
                : '';
            document.getElementById('reportBtn').classList.toggle('hidden', !can('forceReport'));
            document.querySelectorAll('#operationSwitch .op-btn').forEach(btn => {
                btn.classList.toggle('hidden', !can(btn.dataset.op));
            });
        };

        const doLogin = async () => {
            const input = document.getElementById('pinInput');
            const button = document.getElementById('loginBtn');
            const pin = input.value.trim();
            if (!pin) { showLogin('Введіть PIN'); return; }

            const original = button.innerHTML;
            button.innerHTML = '<div class="loader w-5 h-5 border-white"></div>';
            button.disabled = true;
            try {
                const data = await apiPost({ action: 'login', pin: pin, deviceId: getDeviceId() });
                if (data && data.success) {
                    saveSession({
                        token: data.token, name: data.name, shortName: data.shortName,
                        roles: data.roles, permissions: data.permissions, expiresAt: data.expiresAt
                    });
                    input.value = '';
                    hideLogin();
                    applyPermissions();
                    startIdleWatch();
                    // Похідну від PIN рахуємо у фоні: 150 000 ітерацій — це відчутна пауза,
                    // а користувач не має її чекати, щоб увійти
                    saveOfflineUnlock(pin, data);
                    flushOutbox();
                    fetchData();
                } else {
                    showLogin((data && data.error) || 'Невірний PIN');
                }
            } catch (e) {
                // Сервер недоступний — пробуємо локальне розблокування
                const record = await tryOfflineUnlock(pin);
                if (!record) {
                    showLogin('Немає зв’язку. Локальний вхід недоступний — спершу увійдіть один раз онлайн.');
                    return;
                }
                saveSession({
                    token: '', name: record.name, shortName: record.shortName, roles: record.roles,
                    permissions: (record.permissions || []).filter(p => OFFLINE_PERMISSIONS.indexOf(p) !== -1),
                    expiresAt: Date.now() + OFFLINE_SESSION_MS, offline: true
                });
                input.value = '';
                hideLogin();
                applyPermissions();
                startIdleWatch();
                fetchData();
                showToast('Офлайн-режим: записи чекатимуть на зв’язок');
            } finally {
                button.innerHTML = original;
                button.disabled = false;
            }
        };

        const handleAuthFailure = (message) => {
            // Відповідь могла прилетіти вже після виходу — тоді на екрані входу
            // вже написана справжня причина, і затирати її не можна
            if (!session) return;
            clearSession();
            applyPermissions();
            showLogin(message || 'Сесію завершено. Увійдіть за PIN.');
        };

        // --- Черга операцій (outbox) ---
        // Кожна операція спершу лягає в localStorage і лише потім вирушає на сервер.
        // Тому нічого не губиться, навіть якщо вкладку закрили в момент запиту.
        const OUTBOX_KEY = 'zipOutboxV1';
        const OUTBOX_DONE_TTL_MS = 24 * 60 * 60 * 1000;   // «надіслані» лишаються добу — щоб було видно
        const SENDING_STUCK_MS = 2 * 60 * 1000;           // «в польоті» довше двох хвилин = вкладку вбили
        const BACKOFF_MS = [5000, 15000, 60000, 300000];
        const SYNC_INTERVAL_MS = 30000;
        // Ці відповіді сервера повторювати немає сенсу — потрібне рішення людини
        const PERMANENT_CODES = ['FORBIDDEN', 'NOT_FOUND', 'BAD_TARGET', 'NOT_COUNTED',
                                 'OVERDRAW', 'ALREADY_CANCELLED', 'TOO_LATE'];

        let syncing = false;

        const readOutbox = () => {
            try {
                const stored = JSON.parse(localStorage.getItem(OUTBOX_KEY) || 'null');
                if (stored && stored.items) return stored;
            } catch (e) { /* зіпсований запис — починаємо з порожньої черги */ }
            return { version: 1, items: {} };
        };

        // Читаємо-зливаємо-пишемо: дві вкладки не затирають записи одна одної
        const updateOutbox = (mutate) => {
            const box = readOutbox();
            const result = mutate(box.items);
            localStorage.setItem(OUTBOX_KEY, JSON.stringify(box));
            updateNetworkStatus();
            return result;
        };

        const outboxItem = (opId) => readOutbox().items[opId] || null;

        const patchItem = (opId, patch) => updateOutbox(items => {
            if (items[opId]) Object.assign(items[opId], patch);
            return items[opId];
        });

        const removeItem = (opId) => updateOutbox(items => { delete items[opId]; });

        const outboxList = () => Object.keys(readOutbox().items)
            .map(opId => readOutbox().items[opId])
            .sort((a, b) => (a.createdAt < b.createdAt ? -1 : 1));

        const outboxCounts = () => {
            const counts = { pending: 0, sending: 0, failed: 0, done: 0 };
            outboxList().forEach(item => { counts[item.status] = (counts[item.status] || 0) + 1; });
            counts.unsent = counts.pending + counts.sending;
            return counts;
        };

        // Позиції з невідправленими операціями — щоб позначити картки
        const pendingPositions = () => {
            const keys = {};
            outboxList().forEach(item => {
                if (item.status === 'done') return;
                keys[item.payload.sheetName + '|' + item.payload.row] = true;
            });
            return keys;
        };

        const pruneOutbox = () => updateOutbox(items => {
            const now = Date.now();
            Object.keys(items).forEach(opId => {
                const item = items[opId];
                if (item.status === 'done' && now - (item.syncedAt || 0) > OUTBOX_DONE_TTL_MS) {
                    delete items[opId];
                } else if (item.status === 'sending' && now - (item.sendingAt || 0) > SENDING_STUCK_MS) {
                    // Застрягло: повертаємо в чергу. Дубля не буде — сервер відсіє за ідентифікатором
                    item.status = 'pending';
                    item.nextAttemptAt = 0;   // відповіді так і не було — пробуємо одразу
                    item.lastError = 'Відправку перервано — повторюємо';
                }
            });
        });

        const enqueueOperation = (payload) => {
            const createdAt = payload.timestamp || new Date().toISOString();
            const opId = createdAt + '-' + getDeviceId().slice(0, 8) + '-' + Math.random().toString(36).slice(2, 6);
            const item = {
                opId, createdAt,
                payload: Object.assign({}, payload, { timestamp: createdAt }),
                status: 'pending', attempts: 0, nextAttemptAt: 0,
                lastError: '', code: '', syncedAt: null, serverStock: null, response: null
            };
            updateOutbox(items => { items[opId] = item; });
            return item;
        };

        /** Одна спроба відправки. Повертає 'done' | 'failed' | 'pending' | 'auth'. */
        const sendItem = async (opId) => {
            const item = outboxItem(opId);
            if (!item || item.status === 'done') return 'done';

            if (!session || !session.token) {
                patchItem(opId, { status: 'pending', lastError: 'Потрібен вхід онлайн' });
                return 'auth';
            }

            patchItem(opId, { status: 'sending', sendingAt: Date.now() });
            try {
                const result = await apiPost(Object.assign({}, item.payload, {
                    token: session.token, deviceId: getDeviceId()
                }));

                if (result && result.success) {
                    patchItem(opId, {
                        status: 'done', syncedAt: Date.now(), lastError: '', code: '',
                        serverStock: (typeof result.newStock === 'number') ? result.newStock : null,
                        response: result
                    });
                    return 'done';
                }

                const code = (result && result.code) || '';
                if (code === 'AUTH') {
                    patchItem(opId, { status: 'pending', lastError: 'Сесія завершилась' });
                    return 'auth';
                }
                if (PERMANENT_CODES.indexOf(code) !== -1) {
                    patchItem(opId, {
                        status: 'failed', code: code,
                        lastError: (result && result.error) || 'Сервер відхилив запис',
                        response: result
                    });
                    return 'failed';
                }
                return retryLater(item, (result && result.error) || 'Помилка сервера');
            } catch (e) {
                return retryLater(item, 'Немає зв’язку');
            }
        };

        // Пауза між спробами має сенс, поки причина — мовчання мережі.
        // Щойно зв'язок повернувся (подія online, перезавантаження, ручна кнопка) —
        // чекати далі немає підстав, тому таймери скидаємо, лічильник спроб лишаємо.
        const resetBackoff = () => updateOutbox(items => {
            Object.keys(items).forEach(opId => {
                if (items[opId].status === 'pending') items[opId].nextAttemptAt = 0;
            });
        });

        const retryLater = (item, error) => {
            const attempts = (item.attempts || 0) + 1;
            const delay = BACKOFF_MS[Math.min(attempts - 1, BACKOFF_MS.length - 1)];
            patchItem(item.opId, {
                status: 'pending', attempts, nextAttemptAt: Date.now() + delay, lastError: error
            });
            return 'pending';
        };

        /** Відправляє чергу по одному запису, зберігаючи порядок. */
        const flushOutbox = async () => {
            if (syncing) return;
            syncing = true;
            updateNetworkStatus();
            try {
                pruneOutbox();
                let sent = 0;
                for (const item of outboxList()) {
                    if (item.status !== 'pending') continue;
                    if ((item.nextAttemptAt || 0) > Date.now()) continue;

                    const outcome = await sendItem(item.opId);
                    if (outcome === 'done') sent++;
                    if (outcome === 'auth') {
                        if (session && session.token) {
                            handleAuthFailure('Сесія завершилась — увійдіть, щоб надіслати збережені записи');
                        } else if (navigator.onLine) {
                            showLogin('Зв’язок відновлено — увійдіть за PIN, щоб надіслати збережені записи');
                        }
                        break;
                    }
                    if (outcome === 'pending') break;   // немає зв'язку — далі немає сенсу
                }

                const counts = outboxCounts();
                if (sent) {
                    showToast(counts.failed
                        ? `Надіслано ${sent}, не пройшло ${counts.failed} — відкрийте чергу`
                        : `Надіслано ${sent} ${sent === 1 ? 'запис' : 'записів'}`);
                    if (!counts.unsent) fetchData(true);
                }
            } finally {
                syncing = false;
                updateNetworkStatus();
            }
        };

        // --- Статус угорі екрана ---
        const updateNetworkStatus = () => {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            if (!dot || !text) return;

            const counts = outboxCounts();
            if (syncing) {
                dot.className = 'status-dot syncing';
                text.textContent = 'Синхронізація…';
            } else if (counts.failed) {
                dot.className = 'status-dot offline';
                text.textContent = `Помилок ${counts.failed}`;
            } else if (counts.unsent) {
                dot.className = 'status-dot syncing';
                text.textContent = `Черга ${counts.unsent}`;
            } else if (!navigator.onLine) {
                dot.className = 'status-dot offline';
                text.textContent = 'Немає зв’язку';
            } else {
                dot.className = 'status-dot online';
                text.textContent = session && session.offline ? 'Офлайн-режим' : 'Онлайн';
            }
        };

        const showToast = (message) => {
            const toast = document.createElement('div');
            toast.className = 'fixed top-4 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-lg z-[3000] font-bold text-sm transition-opacity duration-300';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 2500);
        };

        // Перенос зі старої черги, якщо на пристрої лишилися незакінчені записи
        const migrateLegacyQueue = () => {
            let legacy = [];
            try { legacy = JSON.parse(localStorage.getItem(OFFLINE_KEY) || '[]'); } catch (e) { legacy = []; }
            if (!legacy.length) return;
            legacy.forEach(payload => enqueueOperation(payload));
            localStorage.removeItem(OFFLINE_KEY);
        };

        // --- Панель черги ---
        const QUEUE_STATUS = {
            pending: { label: 'очікує', cls: 'bg-amber-100 text-amber-800 border-amber-200' },
            sending: { label: 'відправляється', cls: 'bg-blue-100 text-blue-800 border-blue-200' },
            failed:  { label: 'помилка', cls: 'bg-red-100 text-red-800 border-red-200' },
            done:    { label: 'надіслано', cls: 'bg-emerald-100 text-emerald-800 border-emerald-200' }
        };

        const operationLabel = (action) => (OPERATION_UI[action] || {}).short ||
            ({ registerUsage: 'Видача', registerRestock: 'Поповнення', registerInventory: 'Інвентаризація' }[action] || action);

        const renderQueue = () => {
            const list = document.getElementById('queueList');
            const summary = document.getElementById('queueSummary');
            if (!list) return;

            const items = outboxList().reverse();
            const counts = outboxCounts();
            summary.textContent = items.length
                ? `Очікують: ${counts.unsent} · помилок: ${counts.failed} · надіслано за добу: ${counts.done}`
                : 'Черга порожня — усе надіслано';

            list.innerHTML = '';
            items.forEach(item => {
                const status = QUEUE_STATUS[item.status] || QUEUE_STATUS.pending;
                const card = document.createElement('div');
                card.className = 'border border-gray-200 rounded-xl p-3 ' + (item.status === 'done' ? 'opacity-60' : '');
                card.innerHTML = `
                    <div class="flex justify-between items-start gap-2">
                        <div class="min-w-0">
                            <div class="font-bold text-gray-900 truncate">${item.payload.model}</div>
                            <div class="text-xs text-muted">${operationLabel(item.payload.action)} · ${item.payload.quantity} шт · ${new Date(item.createdAt).toLocaleString('uk-UA')}</div>
                        </div>
                        <span class="flex-shrink-0 text-xs font-bold px-2 py-1 rounded border ${status.cls}">${status.label}</span>
                    </div>
                    ${item.lastError ? `<div class="text-xs text-red-700 mt-2">${item.lastError}</div>` : ''}
                `;

                if (item.status !== 'done') {
                    const actions = document.createElement('div');
                    actions.className = 'flex gap-2 mt-3';

                    if (item.status === 'failed') {
                        const fix = document.createElement('button');
                        fix.className = 'flex-1 text-sm font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-lg py-2';
                        fix.textContent = 'Виправити';
                        fix.onclick = async () => { await resolveFailedItem(item.opId); renderQueue(); };
                        actions.appendChild(fix);
                    } else {
                        const retry = document.createElement('button');
                        retry.className = 'flex-1 text-sm font-bold text-blue-700 bg-blue-50 border border-blue-200 rounded-lg py-2';
                        retry.textContent = 'Надіслати';
                        retry.onclick = async () => { patchItem(item.opId, { nextAttemptAt: 0 }); await sendItem(item.opId); renderQueue(); };
                        actions.appendChild(retry);
                    }

                    const drop = document.createElement('button');
                    drop.className = 'text-sm font-bold text-gray-600 bg-gray-100 border border-gray-200 rounded-lg py-2 px-3';
                    drop.textContent = 'Видалити';
                    drop.onclick = async () => {
                        const go = await showCustomDialog(`Видалити запис «${item.payload.model}, ${item.payload.quantity} шт»?\n\nВін не потрапить у журнал.`, true);
                        if (go) { removeItem(item.opId); renderQueue(); }
                    };
                    actions.appendChild(drop);
                    card.appendChild(actions);
                }
                list.appendChild(card);
            });
        };

        const openQueuePanel = () => {
            renderQueue();
            const overlay = document.getElementById('queueOverlay');
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
            flushOutbox().then(renderQueue);
        };

        const closeQueuePanel = () => {
            const overlay = document.getElementById('queueOverlay');
            overlay.classList.add('hidden');
            overlay.classList.remove('flex');
        };

        // --- Отримання даних ---
        const fetchData = async (silent = false) => {
            const loader = document.getElementById('loadingState');
            const loadText = document.getElementById('loadingText');
            loadText.textContent = "Завантаження бази ЗІП...";
            
            if (!silent) {
                document.getElementById('categoriesView').classList.add('hidden');
                document.getElementById('itemsView').classList.add('hidden');
                document.getElementById('historyView').classList.add('hidden');
                loader.classList.remove('hidden');
            }

            try {
                if (!navigator.onLine) {
                    const cached = localStorage.getItem(CACHE_KEY);
                    if (cached) {
                        allData = JSON.parse(cached);
                        renderState();
                        if(!silent) customAlert("Відсутній інтернет. Показано збережені дані.");
                    } else if(!silent) {
                        customAlert("Немає інтернет-з'єднання для завантаження бази.");
                    }
                    loader.classList.add('hidden');
                    return;
                }

                const data = await apiGet('getInventory');

                if (data && data.code === 'AUTH') { handleAuthFailure(); return; }

                if (data && data.success) {
                    allData = data.categories;
                    peopleLists = { controllers: data.controllers || [], employees: data.employees || [] };
                    if (data.session && session) {
                        // Роль могли змінити в довіднику — оновлюємо права щозавантаження
                        saveSession(Object.assign({}, session, {
                            name: data.session.name, permissions: data.session.permissions
                        }));
                        applyPermissions();
                    }
                    localStorage.setItem(CACHE_KEY, JSON.stringify(allData));
                    localStorage.setItem(PEOPLE_KEY, JSON.stringify(peopleLists));
                    renderState();
                } else {
                    throw new Error("Помилка формату даних");
                }
            } catch (error) {
                console.error("Fetch error:", error);
                const timedOut = error && error.name === 'AbortError';
                const cached = localStorage.getItem(CACHE_KEY);
                if (cached) {
                    allData = JSON.parse(cached);
                    if (!silent) customAlert(timedOut
                        ? 'Сервер не відповів вчасно.\nПоказано збережену базу — залишки можуть бути застарілі.'
                        : 'Не вдалося оновити базу.\nПоказано збережену — залишки можуть бути застарілі.');
                } else {
                    // Показувати вигадані залишки на складі не можна: краще чесна відмова
                    allData = [];
                    if (!silent) customAlert(timedOut
                        ? 'Сервер не відповідає, а бази на цьому пристрої ще немає.\nСпробуйте ще раз, коли буде зв’язок.'
                        : 'Не вдалося завантажити базу, а збереженої копії на пристрої ще немає.\nПеревірте зв’язок і спробуйте ще раз.');
                }
                renderState();
            } finally {
                loader.classList.add('hidden');
            }
        };

        const fetchHistory = async (onlyToday = false) => {
            if (!session) { showLogin(); return; }

            appState.filterHistoryToday = onlyToday;
            const loader = document.getElementById('loadingState');
            const loadText = document.getElementById('loadingText');
            loadText.textContent = "Завантаження історії...";

            document.getElementById('categoriesView').classList.add('hidden');
            document.getElementById('itemsView').classList.add('hidden');
            document.getElementById('historyView').classList.add('hidden');
            loader.classList.remove('hidden');

            try {
                if (!navigator.onLine) throw new Error("Offline");
                
                const data = await apiGet('getHistory');

                if (data && data.code === 'AUTH') { handleAuthFailure(); return; }

                if (data && data.success) {
                    historyData = data.history;
                } else {
                    throw new Error("Помилка завантаження історії");
                }
            } catch (error) {
                console.warn("Помилка або офлайн, показуємо порожній список", error);
                historyData = [];
            } finally {
                loader.classList.add('hidden');
                appState.view = 'history';
                renderState();
            }
        };

        const forceSendReport = async () => {
            if (!session) { showLogin(); return; }
            if (!can('forceReport')) { customAlert('Ваша роль не дозволяє надсилати план закупки.'); return; }

            const confirm = await showCustomDialog(
                'Надіслати звіт на пошту?\n\nУ ньому: що потрібно замовити, що потребує інвентаризації, від’ємні залишки, надлишок і рух за тиждень.', true);
            if (!confirm) return;

            const loader = document.getElementById('loadingState');
            const loadText = document.getElementById('loadingText');
            loadText.textContent = "Відправка плану...";
            
            document.getElementById('categoriesView').classList.add('hidden');
            document.getElementById('itemsView').classList.add('hidden');
            document.getElementById('historyView').classList.add('hidden');
            loader.classList.remove('hidden');

            try {
                if (!navigator.onLine) {
                    throw new Error("Offline");
                }
                const data = await apiGet('forceReport', REPORT_TIMEOUT_MS);
                if (data && data.success) {
                    const c = data.counts;
                    customAlert(c
                        ? `✅ Звіт надіслано.\n\nДо замовлення: ${c.deficit} (${c.orderTotal} од.)\nПотребує інвентаризації: ${c.notCounted}\nВід’ємний залишок: ${c.negative}\nНадлишок: ${c.excess}`
                        : '✅ Звіт надіслано.');
                } else if (data && data.code === 'AUTH') {
                    handleAuthFailure();
                } else {
                    customAlert('❌ ' + ((data && data.error) || 'Не вдалося надіслати план'));
                }
            } catch (error) {
                customAlert("❌ Помилка відправки. Перевірте зв'язок з інтернетом.");
            } finally {
                loader.classList.add('hidden');
                renderState();
            }
        };

        // --- Рендеринг (Відображення) ---
        const renderState = () => {
            const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();
            
            const catView = document.getElementById('categoriesView');
            const itemsViewEl = document.getElementById('itemsView');
            const historyViewEl = document.getElementById('historyView');
            const titleEl = document.getElementById('currentCategoryTitle');
            const backBtnContainer = document.getElementById('backBtnContainer');

            historyViewEl.classList.add('hidden');

            // Якщо є пошук, шукаємо по всіх категоріях
            if (searchTerm && appState.view !== 'history') {
                catView.classList.add('hidden');
                itemsViewEl.classList.remove('hidden');
                titleEl.textContent = 'Результати пошуку';
                backBtnContainer.classList.add('hidden'); 
                
                const allItems = allData.flatMap(c => c.items);
                const filtered = allItems.filter(item =>
                    (item.model && item.model.toLowerCase().includes(searchTerm)) ||
                    (item.equipment && item.equipment.toLowerCase().includes(searchTerm)) ||
                    (item.storage && item.storage.toLowerCase().includes(searchTerm)) ||
                    (item.no && String(item.no).toLowerCase().includes(searchTerm))
                );
                
                renderItemsList(filtered, true); 
                return;
            }

            // Режим історії
            if (appState.view === 'history') {
                catView.classList.add('hidden');
                itemsViewEl.classList.add('hidden');
                historyViewEl.classList.remove('hidden');
                renderHistoryList();
                return;
            }

            // Звичайний режим (Категорії або список всередині)
            if (appState.view === 'categories') {
                catView.classList.remove('hidden');
                itemsViewEl.classList.add('hidden');
                renderCategoriesGrid();
            } else if (appState.view === 'items') {
                catView.classList.add('hidden');
                itemsViewEl.classList.remove('hidden');
                backBtnContainer.classList.remove('hidden');
                
                const categoryData = allData.find(c => c.name === appState.activeCategory);
                if(categoryData) {
                    titleEl.textContent = categoryData.name;
                    renderItemsList(categoryData.items, false);
                } else {
                    appState.view = 'categories';
                    renderState();
                }
            }
        };

        const renderCategoriesGrid = () => {
            const container = document.getElementById('categoriesContainer');
            container.innerHTML = '';
            
            if (allData.length === 0) {
                container.innerHTML = '<p class="text-center w-full text-muted py-8 col-span-full">База порожня</p>';
                return;
            }

            allData.forEach(category => {
                const btn = document.createElement('button');
                btn.className = 'category-card p-5 rounded-2xl shadow-sm hover:shadow-md text-left flex flex-col justify-between group h-full border border-gray-200 focus:outline-none focus:ring-2 focus:ring-emerald-500';
                btn.onclick = () => {
                    appState.view = 'items';
                    appState.activeCategory = category.name;
                    renderState();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                };

                btn.innerHTML = `
                    <div class="flex justify-between items-start w-full">
                        <span class="font-bold text-lg text-gray-800 leading-tight pr-2">${category.name}</span>
                        <svg class="h-6 w-6 text-gray-400 group-hover:text-emerald-500 transition-colors flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                    </div>
                    <div class="mt-4">
                        <span class="bg-emerald-50 text-emerald-700 border border-emerald-100 px-3 py-1 rounded-full text-sm font-semibold transition-colors shadow-sm inline-block">
                            ${category.items.length} позицій
                        </span>
                    </div>
                `;
                container.appendChild(btn);
            });
        };

        const renderItemsList = (items, showCategoryBadge) => {
            const container = document.getElementById('inventoryContainer');
            container.innerHTML = '';

            if (items.length === 0) {
                container.innerHTML = '<p class="text-center w-full text-muted py-8 col-span-full">Нічого не знайдено</p>';
                return;
            }

            const pending = pendingPositions();
            items.forEach(item => {
                const awaitingSync = !!pending[item.sheetName + '|' + item.row];
                const notCounted = item.hasStock === false;
                const isLowStock = !notCounted && parseFloat(item.currentStock) <= parseFloat(item.minStock);
                
                const card = document.createElement('div');
                card.className = `inventory-item p-4 rounded-xl cursor-pointer flex flex-col justify-between ${isLowStock ? 'low-stock' : ''}`;
                card.onclick = () => openUsageModal(item);

                card.innerHTML = `
                    <div>
                        <div class="flex items-start justify-between mb-1">
                            <h3 class="font-bold text-lg leading-tight text-emerald-700 pr-2">
                                <span class="bg-gray-200 text-gray-800 text-xs px-2 py-0.5 rounded mr-2 align-middle">№ ${item.no}</span>
                                <span class="align-middle">${item.model}</span>
                            </h3>
                        </div>
                        ${showCategoryBadge ? `<p class="text-xs text-emerald-600 mb-2 font-bold inline-block bg-emerald-50 px-2 py-0.5 rounded">${item.sheetName}</p>` : ''}
                        <p class="text-sm text-gray-600 mb-2 mt-1" title="${item.equipment}">
                            <span class="font-medium text-gray-500">Обладнання:</span> ${item.equipment}
                        </p>
                        ${item.storage ? `<p class="text-xs font-bold text-slate-700 bg-slate-100 border border-slate-200 inline-block px-2 py-0.5 rounded mb-2">📍 ${item.storage}</p>` : ''}
                        ${awaitingSync ? '<p class="text-xs font-bold text-amber-800 bg-amber-50 border border-amber-200 inline-block px-2 py-0.5 rounded mb-2 ml-1">⏳ очікує відправки</p>' : ''}
                        ${(item.supplierName || item.supplierPhone) ? `
                        <div class="text-xs text-indigo-700 bg-indigo-50 p-2 rounded border border-indigo-100 mb-2">
                            <span class="font-bold">Постачальник:</span> ${item.supplierName || '—'} ${item.supplierPhone ? `<br>📞 ${item.supplierPhone}` : ''}
                        </div>` : ''}
                    </div>
                    <div class="flex justify-between items-end mt-auto pt-2 border-t border-gray-200 border-opacity-50">
                        <div class="text-xs text-gray-500">
                            Мін. запас: <span class="font-semibold text-gray-700">${item.minStock}</span>
                        </div>
                        <div class="text-sm text-right">
                            Залишок: <span class="font-bold text-lg ${isLowStock ? 'text-red-600' : 'text-gray-900'}">${notCounted ? '—' : item.currentStock}</span>
                            ${notCounted ? '<div class="text-xs text-amber-700 font-medium">не інвентаризовано</div>' : ''}
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        };

        // Операції, які ще не дійшли до сервера, показуємо поруч із журналом —
        // щоб механік бачив, що вже списав, навіть без мережі
        const localHistoryRecords = () => outboxList()
            .filter(item => item.status !== 'done')
            .reverse()
            .map(item => ({
                id: item.opId, local: true, localStatus: item.status, lastError: item.lastError,
                date: item.payload.date,
                time: new Date(item.createdAt).toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' }),
                sheetName: item.payload.sheetName, model: item.payload.model,
                actionType: operationLabel(item.payload.action),
                controller: session ? session.name : '', usedBy: session ? session.name : '',
                location: item.payload.location, quantity: item.payload.quantity,
                cancelled: false, isCancellation: false
            }));

        const renderHistoryList = () => {
            const container = document.getElementById('historyContainer');
            const titleEl = document.getElementById('historyTitle');
            container.innerHTML = '';

            let filteredHistory = localHistoryRecords().concat(historyData);

            if (appState.filterHistoryToday) {
                titleEl.textContent = "Мої списання за сьогодні";
                const mechanic = session ? session.name : '';
                const todayStr = new Date().toISOString().split('T')[0]; // "YYYY-MM-DD"
                
                filteredHistory = filteredHistory.filter(record => {
                    // Перевіряємо чи дата співпадає з сьогоднішньою (залежить від формату дати в GAS, але GAS має віддавати "YYYY-MM-DD" щоб було легко)
                    // Тому в GAS ми зберігаємо `payload.date`, яка приходить як `YYYY-MM-DD` від інпута `type="date"`
                    const person = (record.usedBy && record.usedBy !== '-') ? record.usedBy : record.controller;
                    return person === mechanic && String(record.date).includes(todayStr);
                });
            } else {
                titleEl.textContent = "Історія рухів";
            }

            if (filteredHistory.length === 0) {
                container.innerHTML = `<div class="text-center w-full text-muted py-8 card rounded-xl border border-gray-200">${appState.filterHistoryToday ? 'Ви сьогодні ще нічого не списували' : 'Історія порожня або немає зв\'язку'}</div>`;
                return;
            }

            filteredHistory.forEach(record => {
                const card = document.createElement('div');
                card.className = 'card p-4 rounded-xl shadow-sm border ' +
                    (record.local ? 'border-amber-300 bg-amber-50' : 'border-gray-200') +
                    (record.cancelled ? ' opacity-60' : '');
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <span class="text-xs font-bold text-gray-500">${record.date} ${record.time || ''}</span>
                            <h4 class="font-bold text-gray-900 mt-1 ${record.cancelled ? 'line-through' : ''}">${record.model}</h4>
                            ${record.cancelled ? '<span class="inline-block mt-1 text-xs font-bold text-red-700 bg-red-50 border border-red-100 px-2 py-0.5 rounded">скасовано</span>' : ''}
                            ${record.local ? `<span class="inline-block mt-1 text-xs font-bold ${record.localStatus === 'failed' ? 'text-red-700 bg-red-50 border-red-200' : 'text-amber-800 bg-amber-100 border-amber-300'} border px-2 py-0.5 rounded">${record.localStatus === 'failed' ? 'не пройшло: ' + record.lastError : 'не надіслано'}</span>` : ''}
                        </div>
                        <span class="${record.actionType === 'Поповнення' ? 'bg-emerald-100 text-emerald-700' : record.actionType === 'Інвентаризація' ? 'bg-blue-100 text-blue-700' : 'bg-red-100 text-red-700'} font-bold px-2 py-1 rounded text-sm whitespace-nowrap">${record.actionType === 'Поповнення' ? '+' : record.actionType === 'Інвентаризація' ? '=' : '-'} ${record.quantity} шт</span>
                    </div>
                    <div class="text-sm text-gray-600 mb-1">
                        <span class="font-medium text-gray-500">Хто видав:</span> ${record.controller || '-'}${(record.usedBy && record.usedBy !== '-' && record.usedBy !== record.controller) ? ' → ' + record.usedBy : ''}
                    </div>
                    <div class="text-sm text-gray-600 mb-1">
                        <span class="font-medium text-gray-500">Де:</span> ${record.location}
                    </div>
                    <div class="text-xs text-indigo-600 font-medium mt-2">
                        Категорія: ${record.sheetName}
                    </div>
                `;

                if (canCancelRecord(record)) {
                    const button = document.createElement('button');
                    button.className = 'mt-3 w-full text-sm font-bold text-red-700 bg-red-50 hover:bg-red-100 border border-red-200 rounded-lg py-2 transition-colors';
                    button.textContent = 'Скасувати операцію';
                    button.onclick = () => cancelRecord(record, button);
                    card.appendChild(button);
                }

                container.appendChild(card);
            });
        };

        // --- Скасування операції ---
        // Рядок журналу не видаляється: сервер помічає початкову операцію
        // скасованою і дописує окремий рядок «Скасування …»
        const CANCEL_WINDOW_MS = 24 * 60 * 60 * 1000;

        const canCancelRecord = (record) => {
            if (record.local) return false;   // ще не в журналі — видаляється з черги
            if (!session || !record.id || record.cancelled || record.isCancellation) return false;
            if (record.actionType === 'Інвентаризація') return false;   // її скасовують новою інвентаризацією
            if (!can('cancelOwn') && !can('cancelAny')) return false;

            const mine = record.usedBy === session.name || record.controller === session.name;
            if (!mine) return can('cancelAny');

            const when = new Date(record.id).getTime();
            if (!isNaN(when) && Date.now() - when > CANCEL_WINDOW_MS) return can('cancelAny');
            return true;
        };

        const cancelRecord = async (record, button) => {
            const confirmed = await showCustomDialog(
                `Скасувати операцію?\n\n${record.actionType}: ${record.model}, ${record.quantity} шт\n${record.date} ${record.time || ''}\n\nЗалишок буде перерахований, а в журналі з’явиться рядок скасування.`, true);
            if (!confirmed) return;

            const original = button.textContent;
            button.textContent = 'Скасовуємо…';
            button.disabled = true;
            try {
                const result = await apiPost({
                    action: 'cancelOperation', timestamp: record.id,
                    sheetName: record.sheetName, model: record.model,
                    token: session.token, deviceId: getDeviceId()
                });
                if (result && result.success) {
                    customAlert('✅ Операцію скасовано. Новий залишок: ' + result.newStock + ' шт');
                    await fetchData(true);
                    await fetchHistory(appState.filterHistoryToday);
                } else if (result && result.code === 'AUTH') {
                    handleAuthFailure();
                } else {
                    customAlert('❌ ' + ((result && result.error) || 'Не вдалося скасувати операцію'));
                }
            } catch (e) {
                customAlert('❌ Немає зв’язку — скасування можливе лише онлайн.');
            } finally {
                button.textContent = original;
                button.disabled = false;
            }
        };

        // --- Логіка пошуку та переходів ---
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearSearchBtn');

        searchInput.addEventListener('input', (e) => {
            const val = e.target.value;
            clearBtn.classList.toggle('hidden', val.length === 0);
            renderState();
        });

        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            clearBtn.classList.add('hidden');
            renderState(); 
        });

        document.getElementById('backToCategoriesBtn').addEventListener('click', () => {
            appState.view = 'categories';
            appState.activeCategory = null;
            renderState();
        });

        // --- Модальне вікно ---
        const modal = document.getElementById('usageModal');
        const modalContent = document.getElementById('usageModalContent');

        const OPERATION_UI = {
            registerUsage:     { qty: 'Кількість використано (шт):', loc: 'Де було використано:',  btn: 'Зареєструвати видачу',     usedBy: true,  toast: 'Успішно списано!' },
            registerRestock:   { qty: 'Кількість надходження (шт):', loc: 'Примітка / накладна:',  btn: 'Зареєструвати поповнення', usedBy: false, toast: 'Поповнення записано!' },
            registerInventory: { qty: 'Фактичний залишок (шт):',     loc: 'Примітка:',             btn: 'Зафіксувати залишок',      usedBy: false, toast: 'Залишок зафіксовано!' }
        };

        const setOperation = (operation) => {
            currentOperation = operation;
            const ui = OPERATION_UI[operation];
            document.getElementById('qtyLabel').textContent = ui.qty;
            document.getElementById('locationLabel').textContent = ui.loc;
            document.getElementById('submitBtnText').textContent = ui.btn;
            document.getElementById('usedByWrap').classList.toggle('hidden', !ui.usedBy);
            document.getElementById('useQuantity').min = operation === 'registerInventory' ? 0 : 1;

            document.querySelectorAll('#operationSwitch .op-btn').forEach(btn => {
                const active = btn.dataset.op === operation;
                btn.className = 'op-btn py-2 px-2 rounded-lg text-sm font-bold border transition-colors ' +
                    (active ? 'bg-emerald-600 text-white border-emerald-600'
                            : 'bg-gray-100 text-gray-700 border-gray-200 hover:bg-gray-200') +
                    // операції, недоступні ролі, лишаються прихованими
                    (can(btn.dataset.op) ? '' : ' hidden');
            });
        };

        document.getElementById('operationSwitch').addEventListener('click', (e) => {
            const btn = e.target.closest('.op-btn');
            if (btn) setOperation(btn.dataset.op);
        });

        const openUsageModal = (item) => {
            if (!session) { showLogin(); return; }
            const mechanic = session.name;

            currentSelectedItem = item;
            
            document.getElementById('modalPartNo').textContent = `№ ${item.no}`;
            document.getElementById('modalPartCategory').textContent = item.sheetName;
            document.getElementById('modalPartName').textContent = item.model;
